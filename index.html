<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Wi-Fi</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #219150; }
        .info { font-size: 13px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Wi-Fi Gratuit</h2>
        
        <!-- ÉTAPE 1 : FORMULAIRE -->
        <form id="form-inscription">
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="email" id="email" placeholder="Email" required>
            <button type="submit" id="btn-envoyer">Recevoir mon code</button>
        </form>

        <!-- ÉTAPE 2 : VALIDATION -->
        <div id="section-code" style="display:none;">
            <p>Code envoyé ! Vérifiez vos emails.</p>
            <input type="text" id="code-entree" placeholder="Entrez le code reçu">
            <button onclick="verifierCode()">Se connecter</button>
        </div>

        <p class="info">En vous connectant, vous acceptez la collecte de vos données à des fins de service.</p>
    </div>

    <script type="text/javascript">
        // --- CONFIGURATION EMAILJS ---
        (function() {
            emailjs.init("c2fKJQhZIUzLmKc11"); // REMPLACE ICI
        })();

        let codeGenere = "";

        document.getElementById('form-inscription').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-envoyer');
            btn.innerText = "Envoi en cours...";
            
            // Génération d'un code aléatoire à 4 chiffres
            codeGenere = Math.floor(1000 + Math.random() * 9000).toString();

            const params = {
                prenom: document.getElementById('prenom').value,
                nom: document.getElementById('nom').value,
                email: document.getElementById('email').value,
                code: codeGenere
            };

            emailjs.send('VOTRE_SERVICE_ID', 'VOTRE_TEMPLATE_ID', params) // REMPLACE ICI
                .then(function() {
                    document.getElementById('form-inscription').style.display = 'none';
                    document.getElementById('section-code').style.display = 'block';
                }, function(error) {
                    alert("Erreur d'envoi : " + JSON.stringify(error));
                });
        };

        function verifierCode() {
            const saisie = document.getElementById('code-entree').value;
            if (saisie === codeGenere) {
                alert("Connexion réussie !");
                // ICI : Redirection vers l'URL de succès Nebula
                window.location.href = "https://google.com"; 
            } else {
                alert("Code incorrect.");
            }
        }
    </script>
</body>
</html>
